<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Job Finder</title>
    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="styles/style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- We need Font Awesome for the logout icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
          <div class="logo">Job Finder</div>
          <ul id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="postJob.html">Post a Job</a></li>
            <li><a href="postWork.html">Post a Work</a></li>
            <!-- Auth links will be added by app.js -->
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="profile-section">
            <!-- 
                UPDATED STRUCTURE:
                This is now a styled card that our JS will populate.
            -->
            <div id="profile-container" class="profile-card-large">
                
                <!-- This is the new avatar, it will show the user's first initial -->
                <div class="profile-avatar" id="profile-avatar">
                    <!-- Letter appears here -->
                </div>
                
                <div class="profile-info">
                    <h2 id="profile-name">Loading...</h2>
                    <p id="profile-email">...</p>
                </div>
                
                <div class="profile-details">
                    <p><strong>Joined:</strong> <span id="profile-joined">...</span></p>
                </div>

                <!-- This logout button is now part of the card -->
                <div class="profile-actions">
                    <button id="profile-logout-button" class="btn-logout-profile">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </button>
                </div>

            </div>

            <!-- The user's activity still appears below the card -->
            
            <div id="user-jobs-container" class="jobs-list">
                <!-- User's posted jobs will appear here -->
            </div>

             <div id="user-work-container" class="workers-list">
                <!-- User's "for hire" profiles will appear here -->
            </div>
            
        </section>
    </main>

    <footer>
      <p>© 2025 Local Employee Job Finder | College Project</p>
    </footer>

    <!-- Your main JS file with all the logic -->
    <script src="js/app.js"></script>
</body>
</html>
