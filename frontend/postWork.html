<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Work</title>
<link rel="stylesheet" href="styles/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
<header>
<nav class="navbar">
  <div class="logo">Job Finder</div>
  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="postJob.html">Post a Job</a></li>
    <li><a href="postWork.html" class="active">Post a Work</a></li>
  </ul>
</nav>
</header>

<section class="form-section">
<div class="form-card">
<h2>Post a Worker</h2>
<p>Fill in your details to get listed for local job opportunities.</p>
<form id="workerForm">
  <input type="text" name="name" placeholder="Your Name" required>
  <input type="text" name="skill" placeholder="Skill" required>
  <input type="text" name="experience" placeholder="Experience" required>
  <div class="location-input-group">
      <input type="text" id="workerLocation" name="location" placeholder="Location" required>
      <button type="button" class="btn-gps" onclick="getCurrentLocation('workerLocation')">Use GPS</button>
  </div>
  <input type="text" name="contact" placeholder="Contact Number" required>
  <button type="submit" class="btn primary">Submit Worker</button>
</form>
</div>
</section>

<section class="list-section">
<h2>Available Jobs</h2>
<div id="jobsList" class="features">
  </div>
</section>

<footer>
  <p>© 2025 Local Employee Job Finder | College Project</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
